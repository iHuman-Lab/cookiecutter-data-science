[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "{{ cookiecutter.repo_name }}"
version = "0.1.0"
description = "{{ cookiecutter.project_short_description }}"
authors = [
    { name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.email }}" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

dependencies = [
    "click",
    "Sphinx",
    "coverage",
    "awscli",
    "flake8",
    "python-dotenv>=0.5.1",
    {% if cookiecutter.python_interpreter != 'python3' %}
    "pathlib2",
    {% endif %}
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pre-commit",
    "ruff",
    "black",
    "isort",
    "mypy"
]

[project.urls]
Repository = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.repo_name }}"
Issues = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.repo_name }}/issues"

[tool.setuptools]
packages = ["src"]
package-dir = {"" = "src"}

# Ruff: Linting, PEP8, and naming convention enforcement
[tool.ruff]
select = ["E", "F", "N"]  # E: pycodestyle, F: pyflakes, N: pep8-naming
line-length = 88
target-version = "py38"

# Black: Code formatting
[tool.black]
line-length = 88
target-version = ['py38']

# isort: Import sorting
[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]

# pytest
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
